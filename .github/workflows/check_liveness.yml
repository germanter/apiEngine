name: URL Checker & Compressor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3' 

      - name: Install Dependencies
        run: |
          pip install httpx playwright
          python -m playwright install chromium
          sudo python -m playwright install-deps chromium

      - name: Run Engine

        run: python engine/runner.py 2>&1 | tee report.txt

      - name: Save Results as Artifact

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveness-report
          path: report.txt

      - name: Commit and Push Changes

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add api.json apiCmp.json incoming.json
          
          if git diff --staged --quiet; then
            echo "No changes in data files. Skipping push."
          else
            git commit -m "Auto-update: data files [skip ci]"
            git push
          fi
